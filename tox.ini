[tox]
envlist =
    linuxp-py310
    linuxp-py311
    linuxp-py312
    linuxp-py313
skip_missing_interpreters = true

[testenv]
deps =
    pytest
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/linuxp
commands =
    pytest

[gh-actions]
python =
    3.10: linuxp-py310
    3.11: linuxp-py311
    3.12: linuxp-py312
    3.13: linuxp-py313
